name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repo structure
        run: |
          echo "Phase 0 CI: structure check"
          test -f docs/PROJECT_PROMPT.md
          test -d scripts
          echo "Structure OK"